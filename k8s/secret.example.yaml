# Plantilla. NO subas la versión real de este fichero a ningún repositorio.
#
# Generarla desde tu .env (no escribas los valores a mano dos veces):
#   kubectl create secret generic finanzas-env \
#     --from-env-file=.env \
#     --namespace finanzas \
#     --dry-run=client -o yaml > k8s/secret.yaml
#
# O, en un cluster gestionado por GitOps, usa Sealed Secrets / SOPS / External
# Secrets en vez de aplicar esto directamente.
apiVersion: v1
kind: Secret
metadata:
  name: finanzas-env
  namespace: finanzas
type: Opaque
stringData:
  APP_PASSWORD: "cambia-esto"
  AUTH_SALT: "cambia-esto-tambien"
  APP_URL: "https://finanzas.tudominio.com"
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: "mailto:tu@email.com"
  CRON_SECRET: ""
  GOCARDLESS_SECRET_ID: ""
  GOCARDLESS_SECRET_KEY: ""
